body:
  - text: >-
      Familia tipográfica didona para el sistema tipográfico Nomada. El diseño
      adapta las características clásicas de las didonas para ofrecer una visión
      más contemporánea y versátil. Las 18 fuentes incluidas dan forma a una
      amplia paleta tipográfica.


