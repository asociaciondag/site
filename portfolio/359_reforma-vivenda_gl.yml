body:
  - text: >-
      Reforma dun piso nun edificio dos anos 70 que non sufrira ningunha
      actualización. Tratábase dun piso con demasiadas divisións, con boa luz
      natural pero que non chegaba a todos os recunchos. Decidimos comunicar
      estancias aproveitando a luz natural, ademais de aplicar novos acabados,
      novas instalacións e equipamento.
