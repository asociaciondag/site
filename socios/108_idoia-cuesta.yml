es:
  bio: >-
    Mi trabajo se basa en la fusión de la cestería con el textil y la
    versatilidad de la pieza resultante, a través de la combinación de
    materiales orgánicos con diferentes técnicas artesanales. A lo largo de
    estas décadas he aprendido y trabajado con profesionales de muy diversos
    orígenes, culturas, experiencias y conocimientos que me han abierto la mente
    y me han aportado nuevas visiones sobre el arte, el diseño, la arquitectura,
    la moda y la artesanía contemporáneas.
